<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>続・せがれいじり風 変珍3Dシアター</title>
    <!-- Three.js 本体 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        * { box-sizing: border-box; user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Meiryo', sans-serif; }

        /* オープニング動画画面 */
        #intro-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #111; z-index: 500;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .start-btn {
            margin-top: 20px; padding: 15px 40px; font-size: 24px; font-weight: bold;
            color: #fff; background: #ff007f; border: none; border-radius: 10px;
            cursor: pointer; box-shadow: 0 5px 0 #99004d; transition: transform 0.1s;
        }
        .start-btn:active { transform: translateY(5px); box-shadow: none; }

        /* 3Dキャンバス */
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }

        /* 左側のハシゴメーターUI */
        #ladder-ui {
            position: absolute; left: 20px; top: 20px; bottom: 20px; width: 70px;
            z-index: 10; display: flex; flex-direction: column; align-items: center; pointer-events: none;
        }
        .mother-icon {
            width: 65px; height: 65px; background: #00ff66; border: 4px solid #009933;
            border-radius: 50% 50% 10% 10%; display: flex; align-items: center; justify-content: center;
            font-size: 35px; box-shadow: 0 0 10px rgba(0,0,0,0.5); z-index: 2;
        }
        .ladder-body {
            position: relative; width: 30px; flex-grow: 1; margin-top: -10px;
            border-left: 6px solid #ffcc00; border-right: 6px solid #ffcc00;
            display: flex; flex-direction: column; justify-content: space-evenly;
            background: rgba(0,0,0,0.15);
        }
        .ladder-rung { height: 5px; background: #ffcc00; width: 100%; }

        /* ハシゴを登る主人公型アイコン */
        #player-ladder-icon {
            position: absolute; left: -8px; bottom: 0%; width: 34px; height: 34px;
            background: #ffcc00; clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            border: 2px solid #000; transition: bottom 0.5s ease-out; z-index: 5;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));
        }

        /* UIパネル (近接時表示) */
        #ui-layer {
            display: none; position: absolute; bottom: 20px; width: 100%; z-index: 20;
            flex-direction: column; align-items: center; pointer-events: none;
        }
        .dialog {
            pointer-events: auto; background: rgba(255,255,255,0.95); border: 4px solid #ffcc00;
            border-radius: 15px; padding: 12px 20px; margin-bottom: 12px; max-width: 600px;
            text-align: center; font-weight: bold; font-size: 18px; color: #333; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .sentence-panel {
            pointer-events: auto; background: rgba(0, 0, 0, 0.85); border: 4px solid #00e5ff;
            border-radius: 15px; padding: 15px; text-align: center;
        }
        select {
            font-size: 16px; font-weight: bold; padding: 8px; margin: 4px;
            border-radius: 8px; border: 3px solid #ffaa00; background-color: #fff; cursor: pointer;
        }
        .action-btn {
            font-size: 20px; font-weight: bold; padding: 10px 25px; margin-top: 8px;
            background: #00e5ff; color: #000; border: none; border-radius: 8px; cursor: pointer;
            box-shadow: 0 5px 0 #008b8b;
        }
        .action-btn:active { transform: translateY(4px); box-shadow: none; }

        /* 変珍シュール演出用 */
        #surreal-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 200; background: repeating-radial-gradient(circle, #ff0055, #ffff00 10%, #0000ff 20%);
            animation: spinBg 3s linear infinite, flashBg 0.1s infinite alternate;
            overflow: hidden; pointer-events: none;
        }
        @keyframes spinBg { from { background-position: 0 0; } to { background-position: 100% 100%; } }
        @keyframes flashBg { 0% { filter: invert(0%) hue-rotate(0deg); } 100% { filter: invert(100%) hue-rotate(180deg); } }
        
        .surreal-text {
            position: absolute; font-size: 80px; font-weight: 900; color: #fff;
            text-shadow: 4px 4px 0 #000, -4px -4px 0 #000; white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- オープニング動画 -->
    <div id="intro-overlay">
        <h2 style="color:white; margin-bottom: 10px;">続・せがれいじり風 オープニング</h2>
        <iframe width="640" height="360" src="https://www.youtube.com/embed/hpQIPh4-kRE?rel=0" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        <button class="start-btn" onclick="startGame()">動画を見たら地球へいく（ゲーム開始）</button>
    </div>

    <!-- 左側のハシゴメーターUI -->
    <div id="ladder-ui">
        <div class="mother-icon">👧</div>
        <div class="ladder-body">
            <!-- ハシゴを登る主人公アイコン -->
            <div id="player-ladder-icon"></div>
            <div class="ladder-rung"></div><div class="ladder-rung"></div>
            <div class="ladder-rung"></div><div class="ladder-rung"></div>
            <div class="ladder-rung"></div><div class="ladder-rung"></div>
            <div class="ladder-rung"></div><div class="ladder-rung"></div>
        </div>
    </div>

    <!-- 変珍演出 -->
    <div id="surreal-overlay"></div>

    <!-- 3D画面 -->
    <div id="canvas-container"></div>

    <!-- 作文UI -->
    <div id="ui-layer">
        <div class="dialog" id="dialog-text">
            👤 まちのひと<br>「ヘンテコな文章でいじっておくれ～！」
        </div>
        <div class="sentence-panel">
            <div style="color:#fff; margin-bottom: 5px; font-weight:bold;">
                変珍（いじる）対象: 
                <select id="target-select">
                    <option value="npc">目の前の「まちのひと」</option>
                    <option value="android">仲間「リアルアンドロイド」</option>
                </select>
            </div>
            <select id="w1">
                <option value="せがれ">せがれが</option>
                <option value="マザー">マザーの愛で</option>
                <option value="セケーン">セケーンの風に吹かれ</option>
            </select>
            <select id="w2">
                <option value="dance">激しくブレイクダンスして</option>
                <option value="stretch">限界まで伸び切って</option>
                <option value="spin">メカメカしく回転して</option>
            </select>
            <select id="w3">
                <option value="unko">黄金のウンチになった</option>
                <option value="moai">モアイ像になった</option>
                <option value="segare">メカせがれになった</option>
            </select>
            <br>
            <button class="action-btn" onclick="triggerHenchin()">変珍（いじる）</button>
        </div>
    </div>

<script>
    // --- 音声・BGM・SE ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function startBGM() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
        let noteIdx = 0;
        setInterval(() => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(notes[noteIdx], audioCtx.currentTime);
            gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            noteIdx = (noteIdx + 1) % notes.length;
        }, 250);
    }

    function playCrazySound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(50, audioCtx.currentTime);
        for(let i=0; i<30; i++) {
            osc.frequency.setValueAtTime(Math.random() * 2000 + 100, audioCtx.currentTime + (i * 0.1));
        }
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 3.0);
        osc.start(); osc.stop(audioCtx.currentTime + 3.0);
    }

    function playPop() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }

    function speakSentence(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const uttr = new SpeechSynthesisUtterance(text);
            uttr.lang = 'ja-JP';
            uttr.pitch = 1.3;
            uttr.rate = 1.1;
            window.speechSynthesis.speak(uttr);
        }
    }

    // --- ゲーム開始 ---
    function startGame() {
        document.getElementById('intro-overlay').style.display = 'none';
        if (audioCtx.state === 'suspended') audioCtx.resume();
        startBGM();
        init3D();
        alert("【手動操作方法】\n・WASD / 矢印キー: 移動\n・画面ドラッグ / スワイプ: 視点（カメラ）の自由変更\n・変珍を行うと、左側のハシゴを主人公が登っていきます！");
    }

    // --- Three.js 3D処理 ---
    let scene, camera, renderer;
    let playerGroup, companionAndroidGroup;
    let npcList = []; // 増量した町の人たち
    let currentTargetNPC = null;
    let isAnimating = false;
    let ladderProgress = 0; // ハシゴの進行度(%)
    const PLANET_RADIUS = 22;

    // 手動カメラコントロール変数
    let isMouseDown = false;
    let mouseX = 0, mouseY = 0;
    let cameraAngleX = 0; // 水平角度
    let cameraAngleY = 0.4; // 垂直角度
    let cameraDistance = 9;

    const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
    window.addEventListener('keydown', (e) => { if (e.key in keys) keys[e.key] = true; });
    window.addEventListener('keyup', (e) => { if (e.key in keys) keys[e.key] = false; });

    function init3D() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x38b6ff); // 爽やかな青空の背景色へ修正

        // 雲の追加
        buildClouds();

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // 照明
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(30, 50, 30);
        scene.add(dirLight);

        // 丸い地球（地面）
        const textureLoader = new THREE.TextureLoader();
        const dirtTexture = textureLoader.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/textures/terrain/grasslight-big.jpg');
        dirtTexture.wrapS = THREE.RepeatWrapping; dirtTexture.wrapT = THREE.RepeatWrapping;
        dirtTexture.repeat.set(12, 12);

        const planetGeo = new THREE.SphereGeometry(PLANET_RADIUS, 64, 64);
        const planetMat = new THREE.MeshStandardMaterial({ map: dirtTexture, roughness: 0.8 });
        const planetMesh = new THREE.Mesh(planetGeo, planetMat);
        scene.add(planetMesh);

        // 森と花
        buildWorldForest();

        // 主人公（黄色矢印頭）
        playerGroup = new THREE.Group();
        scene.add(playerGroup);
        buildYellowArrowPlayer(playerGroup);
        playerGroup.position.set(0, PLANET_RADIUS, 0);

        // リアルアンドロイド
        companionAndroidGroup = new THREE.Group();
        scene.add(companionAndroidGroup);
        buildRealAndroid(companionAndroidGroup);
        companionAndroidGroup.position.set(0, PLANET_RADIUS, -2);

        // ★ 町の人を複数人増やす（4人配置）
        const npcPositions = [
            { x: -4, z: -4 },
            { x: 6, z: -5 },
            { x: -7, z: 5 },
            { x: 5, z: 6 }
        ];
        npcPositions.forEach(pos => {
            const npc = new THREE.Group();
            buildSurrealNPC(npc);
            npc.position.set(pos.x, PLANET_RADIUS, pos.z);
            scene.add(npc);
            npcList.push(npc);
        });

        // 手動カメラドラッグイベント登録
        container.addEventListener('mousedown', (e) => { isMouseDown = true; mouseX = e.clientX; mouseY = e.clientY; });
        window.addEventListener('mouseup', () => { isMouseDown = false; });
        container.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
            const deltaX = e.clientX - mouseX;
            const deltaY = e.clientY - mouseY;
            cameraAngleX -= deltaX * 0.005;
            cameraAngleY = Math.max(0.1, Math.min(Math.PI / 2.2, cameraAngleY + deltaY * 0.005));
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    }

    // 青空と雲の生成
    function buildClouds() {
        const cloudGroup = new THREE.Group();
        const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 });
        for (let i = 0; i < 20; i++) {
            const cloud = new THREE.Mesh(new THREE.SphereGeometry(3 + Math.random()*3, 8, 8), cloudMat);
            cloud.position.set((Math.random()-0.5)*120, 30 + Math.random()*20, (Math.random()-0.5)*120);
            cloudGroup.add(cloud);
        }
        scene.add(cloudGroup);
    }

    function buildWorldForest() {
        const barkMat = new THREE.MeshStandardMaterial({ color: 0x8b4513 });
        const leafMat = new THREE.MeshStandardMaterial({ color: 0x00b300, roughness: 0.5 });

        for (let i = 0; i < 35; i++) {
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.45, 3, 8), barkMat);
            trunk.position.y = 1.5;
            const leaf = new THREE.Mesh(new THREE.SphereGeometry(1.3, 12, 12), leafMat);
            leaf.position.y = 3.2;
            tree.add(trunk, leaf);

            const phi = Math.random() * Math.PI * 0.45;
            const theta = Math.random() * Math.PI * 2;
            const x = PLANET_RADIUS * Math.sin(phi) * Math.cos(theta);
            const y = PLANET_RADIUS * Math.cos(phi);
            const z = PLANET_RADIUS * Math.sin(phi) * Math.sin(theta);

            tree.position.set(x, y, z);
            const up = new THREE.Vector3(x, y, z).normalize();
            tree.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), up);
            scene.add(tree);
        }
    }

    function buildYellowArrowPlayer(group) {
        clearGroup(group);
        const yellowMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, metalness: 0.2 });
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });

        const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.4), bodyMat);
        body.position.y = 0.8;
        const legL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.6, 0.2), bodyMat);
        legL.position.set(-0.2, 0.3, 0);
        const legR = legL.clone(); legR.position.x = 0.2;

        const arrowHead = new THREE.Mesh(new THREE.ConeGeometry(0.65, 0.85, 4), yellowMat);
        arrowHead.position.y = 1.6;
        arrowHead.rotation.y = Math.PI / 4;

        group.add(body, legL, legR, arrowHead);
    }

    // ★ アンドロイドのデザインをリアル化（メタリック質感・サイバーアイ・発光部・ジョイント部）
    function buildRealAndroid(group) {
        clearGroup(group);
        const metalMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9, roughness: 0.15 });
        const darkMetalMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8, roughness: 0.3 });
        const glowEyeMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 0.8 });
        const coreMat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055 });

        // 胴体
        const chest = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.4), metalMat);
        chest.position.y = 1.0;
        const core = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.05, 16), coreMat);
        core.rotation.x = Math.PI/2; core.position.set(0, 1.0, 0.22);

        // 頭部
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.45, 0.45), metalMat);
        head.position.y = 1.6;
        const visior = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.1), glowEyeMat);
        visior.position.set(0, 1.65, 0.22);

        // 関節・手足
        const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.6), darkMetalMat);
        armL.position.set(-0.45, 0.9, 0);
        const armR = armL.clone(); armR.position.x = 0.45;

        const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.08, 0.7), darkMetalMat);
        legL.position.set(-0.2, 0.35, 0);
        const legR = legL.clone(); legR.position.x = 0.2;

        group.add(chest, core, head, visior, armL, armR, legL, legR);
    }

    function buildSurrealNPC(group) {
        clearGroup(group);
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
        const hairMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const pantsMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c });

        const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.0), skinMat);
        head.position.y = 1.6;
        const hair = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.4, 1.05), hairMat);
        hair.position.y = 2.1;
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.3), pantsMat);
        body.position.y = 0.7;

        group.add(head, hair, body);
    }

    // 変珍パーツモデル
    function buildPoopModel(group) {
        clearGroup(group);
        const goldMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, roughness: 0.1 });
        const t1 = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.4, 16, 32), goldMat);
        t1.rotation.x = Math.PI/2; t1.position.y = 0.4;
        const top = new THREE.Mesh(new THREE.ConeGeometry(0.5, 0.8, 16), goldMat);
        top.position.y = 1.2;
        group.add(t1, top);
    }

    function buildMoaiModel(group) {
        clearGroup(group);
        const stoneMat = new THREE.MeshStandardMaterial({ color: 0x778899, roughness: 0.9 });
        const face = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.2, 1.2), stoneMat);
        face.position.y = 1.1;
        const nose = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.8, 0.5), stoneMat);
        nose.position.set(0, 1.1, 0.7);
        group.add(face, nose);
    }

    function buildSegareModel(group) {
        clearGroup(group);
        const yellowMat = new THREE.MeshStandardMaterial({ color: 0xffcc00 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.6, 1.0), yellowMat);
        body.position.set(0, 0.6, 0);
        const neck = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.8, 0.3), yellowMat);
        neck.position.set(0, 1.5, 0.3);
        group.add(body, neck);
    }

    function clearGroup(group) {
        while(group.children.length > 0) group.remove(group.children[0]);
    }

    // --- 変珍（へんちん）処理 ---
    function triggerHenchin() {
        if (isAnimating) return;
        isAnimating = true;

        const targetType = document.getElementById('target-select').value;
        const w1Text = document.getElementById('w1').options[document.getElementById('w1').selectedIndex].text;
        const w2Text = document.getElementById('w2').options[document.getElementById('w2').selectedIndex].text;
        const w3Text = document.getElementById('w3').options[document.getElementById('w3').selectedIndex].text;
        const fullSentence = `${w1Text} ${w2Text} ${w3Text}！`;

        const w3Value = document.getElementById('w3').value;
        const overlay = document.getElementById('surreal-overlay');
        const uiLayer = document.getElementById('ui-layer');
        
        uiLayer.style.display = 'none';
        overlay.style.display = 'block';
        
        playCrazySound();
        speakSentence(fullSentence);

        // ★ 変珍を行うと、ハシゴメーターを主人公アイコンが登る！
        ladderProgress = Math.min(100, ladderProgress + 20);
        document.getElementById('player-ladder-icon').style.bottom = ladderProgress + '%';

        const words = ["セケーン！", "マザー", "変・珍", "オトナ", "ヤバい", "バカ", "ヘンテコ"];
        let interval = setInterval(() => {
            const div = document.createElement('div');
            div.className = 'surreal-text';
            div.innerText = words[Math.floor(Math.random() * words.length)];
            div.style.left = (Math.random() * 80) + 'vw';
            div.style.top = (Math.random() * 80) + 'vh';
            div.style.transform = `rotate(${Math.random() * 360}deg) scale(${Math.random() * 2 + 0.5})`;
            div.style.color = Math.random() > 0.5 ? '#ff00ff' : '#00ffff';
            overlay.appendChild(div);
            setTimeout(() => div.remove(), 300);
        }, 150);

        setTimeout(() => {
            clearInterval(interval);
            overlay.innerHTML = '';
            overlay.style.display = 'none';
            playPop();

            // 変身対象の切り替え（町の人 or アンドロイド）
            const targetGroup = (targetType === 'android') ? companionAndroidGroup : currentTargetNPC;

            if (targetGroup) {
                if (w3Value === 'unko') buildPoopModel(targetGroup);
                else if (w3Value === 'moai') buildMoaiModel(targetGroup);
                else if (w3Value === 'segare') buildSegareModel(targetGroup);
            }
            
            isAnimating = false;
        }, 3200);
    }

    // メインアニメーションループ
    function animate() {
        requestAnimationFrame(animate);
        
        if (playerGroup && companionAndroidGroup) {
            if (!isAnimating) {
                const speed = 0.08;
                let moved = false;

                if (keys.w || keys.ArrowUp) { playerGroup.position.z -= speed; moved = true; }
                if (keys.s || keys.ArrowDown) { playerGroup.position.z += speed; moved = true; }
                if (keys.a || keys.ArrowLeft) { playerGroup.position.x -= speed; moved = true; }
                if (keys.d || keys.ArrowRight) { playerGroup.position.x += speed; moved = true; }

                // 地球カーブ維持
                const dist = Math.sqrt(playerGroup.position.x ** 2 + playerGroup.position.z ** 2);
                playerGroup.position.y = Math.sqrt(Math.max(1, PLANET_RADIUS ** 2 - dist ** 2));

                // リアルアンドロイドのスムーズ追従
                const targetPos = playerGroup.position.clone().add(new THREE.Vector3(0.8, 0, 1.2));
                companionAndroidGroup.position.lerp(targetPos, 0.08);

                // ★ 完全手動カメラ位置調整
                camera.position.x = playerGroup.position.x + cameraDistance * Math.sin(cameraAngleX) * Math.cos(cameraAngleY);
                camera.position.z = playerGroup.position.z + cameraDistance * Math.cos(cameraAngleX) * Math.cos(cameraAngleY);
                camera.position.y = playerGroup.position.y + cameraDistance * Math.sin(cameraAngleY);
                camera.lookAt(playerGroup.position.x, playerGroup.position.y + 0.8, playerGroup.position.z);

                // 近くの「町の人」を検知
                let nearNPC = null;
                for (let npc of npcList) {
                    if (playerGroup.position.distanceTo(npc.position) < 3.8) {
                        nearNPC = npc;
                        break;
                    }
                }

                const uiLayer = document.getElementById('ui-layer');
                if (nearNPC) {
                    currentTargetNPC = nearNPC;
                    uiLayer.style.display = 'flex';
                } else {
                    uiLayer.style.display = 'none';
                }
            }
        }

        renderer.render(scene, camera);
    }
</script>
