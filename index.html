<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>続・せがれいじり風 変珍3Dシアター</title>
    <!-- Three.js 本体 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 外部3Dモデル読み込み用（GLTFLoader） -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <style>
        * { box-sizing: border-box; user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Meiryo', sans-serif; }

        /* オープニング動画画面 */
        #intro-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #111; z-index: 500;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .start-btn {
            margin-top: 20px; padding: 15px 40px; font-size: 24px; font-weight: bold;
            color: #fff; background: #ff007f; border: none; border-radius: 10px;
            cursor: pointer; box-shadow: 0 5px 0 #99004d; transition: transform 0.1s;
        }
        .start-btn:active { transform: translateY(5px); box-shadow: none; }

        /* 3Dキャンバス */
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* 左側のハシゴメーターUI */
        #ladder-ui {
            position: absolute; left: 20px; top: 20px; bottom: 20px; width: 70px;
            z-index: 10; display: flex; flex-direction: column; align-items: center; pointer-events: none;
        }
        .mother-icon {
            width: 65px; height: 65px; background: #00ff66; border: 4px solid #009933;
            border-radius: 50% 50% 10% 10%; display: flex; align-items: center; justify-content: center;
            font-size: 35px; box-shadow: 0 0 10px rgba(0,0,0,0.5); z-index: 2;
        }
        .ladder-body {
            width: 30px; flex-grow: 1; margin-top: -10px;
            border-left: 6px solid #ffcc00; border-right: 6px solid #ffcc00;
            display: flex; flex-direction: column; justify-content: space-evenly;
            background: rgba(0,0,0,0.1);
        }
        .ladder-rung { height: 5px; background: #ffcc00; width: 100%; }

        /* UIパネル (町の人に近づくと表示) */
        #ui-layer {
            display: none; position: absolute; bottom: 20px; width: 100%; z-index: 20;
            flex-direction: column; align-items: center; pointer-events: none;
        }
        .dialog {
            pointer-events: auto; background: rgba(255,255,255,0.95); border: 4px solid #ffcc00;
            border-radius: 15px; padding: 15px; margin-bottom: 15px; max-width: 600px;
            text-align: center; font-weight: bold; font-size: 18px; color: #333; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .sentence-panel {
            pointer-events: auto; background: rgba(0, 0, 0, 0.85); border: 4px solid #00e5ff;
            border-radius: 15px; padding: 20px; text-align: center;
        }
        select {
            font-size: 18px; font-weight: bold; padding: 10px; margin: 5px;
            border-radius: 8px; border: 3px solid #ffaa00; background-color: #fff; cursor: pointer;
        }
        .action-btn {
            font-size: 22px; font-weight: bold; padding: 12px 30px; margin-top: 10px;
            background: #00e5ff; color: #000; border: none; border-radius: 8px; cursor: pointer;
            box-shadow: 0 5px 0 #008b8b;
        }
        .action-btn:active { transform: translateY(5px); box-shadow: none; }

        /* 変珍（へんちん）シュールアニメーション用オーバーレイ */
        #surreal-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 200; background: repeating-radial-gradient(circle, #ff0055, #ffff00 10%, #0000ff 20%);
            animation: spinBg 3s linear infinite, flashBg 0.1s infinite alternate;
            overflow: hidden; pointer-events: none;
        }
        @keyframes spinBg { from { background-position: 0 0; } to { background-position: 100% 100%; } }
        @keyframes flashBg { 0% { filter: invert(0%) hue-rotate(0deg); } 100% { filter: invert(100%) hue-rotate(180deg); } }
        
        .surreal-text {
            position: absolute; font-size: 80px; font-weight: 900; color: #fff;
            text-shadow: 4px 4px 0 #000, -4px -4px 0 #000; white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- オープニング動画（YouTube埋め込み） -->
    <div id="intro-overlay">
        <h2 style="color:white; margin-bottom: 10px;">続・せがれいじり風 オープニング</h2>
        <iframe width="640" height="360" src="https://www.youtube.com/embed/hpQIPh4-kRE?rel=0" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        <button class="start-btn" onclick="startGame()">動画を見たら地球へいく（ゲーム開始）</button>
    </div>

    <!-- 左側のハシゴメーターUI -->
    <div id="ladder-ui">
        <div class="mother-icon">👧</div>
        <div class="ladder-body">
            <div class="ladder-rung"></div>
            <div class="ladder-rung"></div>
            <div class="ladder-rung"></div>
            <div class="ladder-rung"></div>
            <div class="ladder-rung"></div>
            <div class="ladder-rung"></div>
            <div class="ladder-rung"></div>
            <div class="ladder-rung"></div>
            <div class="ladder-rung"></div>
        </div>
    </div>

    <!-- シュールアニメーション演出（変珍時） -->
    <div id="surreal-overlay"></div>

    <!-- 3D表示領域 -->
    <div id="canvas-container"></div>

    <!-- UI (町の人の近くで表示) -->
    <div id="ui-layer">
        <div class="dialog">
            👤 まちのひと<br>
            「ボクをヘンテコな文章で変珍（へんちん）させてみてくれ～！」
        </div>
        <div class="sentence-panel">
            <select id="w1">
                <option value="せがれ">せがれが</option>
                <option value="マザー">マザーの愛で</option>
                <option value="セケーン">セケーンの風に吹かれ</option>
            </select>
            <select id="w2">
                <option value="dance">激しくブレイクダンスして</option>
                <option value="stretch">限界まで伸び切って</option>
                <option value="spin">高速回転しながら</option>
            </select>
            <select id="w3">
                <option value="unko">黄金のウンチになった</option>
                <option value="moai">モアイ像になった</option>
                <option value="segare">せがれ（本人）になった</option>
            </select>
            <br>
            <button class="action-btn" id="henchin-btn" onclick="triggerHenchin()">変珍（いじる）</button>
        </div>
    </div>

<script>
    // --- 音声・BGM・SE（Web Audio API & SpeechSynthesis） ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let bgmOsc = null;

    // ポップなループBGM再生
    function startBGM() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
        let noteIdx = 0;
        setInterval(() => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(notes[noteIdx], audioCtx.currentTime);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            noteIdx = (noteIdx + 1) % notes.length;
        }, 250);
    }

    function playCrazySound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(50, audioCtx.currentTime);
        for(let i=0; i<30; i++) {
            osc.frequency.setValueAtTime(Math.random() * 2000 + 100, audioCtx.currentTime + (i * 0.1));
        }
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 3.0);
        osc.start(); osc.stop(audioCtx.currentTime + 3.0);
    }

    function playPop() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }

    // 日本語文章の読み上げ（SpeechSynthesis）
    function speakSentence(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const uttr = new SpeechSynthesisUtterance(text);
            uttr.lang = 'ja-JP';
            uttr.pitch = 1.3; // 高めのヘンテコボイス
            uttr.rate = 1.1;
            window.speechSynthesis.speak(uttr);
        }
    }

    // --- ゲーム開始処理 ---
    function startGame() {
        document.getElementById('intro-overlay').style.display = 'none';
        if (audioCtx.state === 'suspended') audioCtx.resume();
        startBGM();
        init3D();
        alert("【操作方法】\n「WASD」または「矢印キー」で主人公を動かそう！\nカメラが自動で後ろに回り込みます。アンドロイドがついてくるよ！");
    }

    // --- Three.js 3Dグラフィック処理 ---
    let scene, camera, renderer;
    let playerGroup, companionAndroidGroup, npcGroup;
    let barkTexture, leafTexture, dirtTexture;
    let playerHeading = 0; // 主人公の向き
    let isAnimating = false;
    const PLANET_RADIUS = 22;

    const keys = { w: false, a: false, s: false, d: false, W: false, A: false, S: false, D: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
    window.addEventListener('keydown', (e) => { if (e.key in keys) keys[e.key] = true; });
    window.addEventListener('keyup', (e) => { if (e.key in keys) keys[e.key] = false; });

    function init3D() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();

        // 1. 空（インターネット上の360度パノラマ素材）
        const textureLoader = new THREE.TextureLoader();
        textureLoader.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/textures/2294472375_24a3b8ef46_o.jpg', (tex) => {
            tex.mapping = THREE.EquirectangularReflectionMapping;
            scene.background = tex;
        });

        // インターネット素材（土・木）の読み込み
        dirtTexture = textureLoader.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/textures/terrain/grasslight-big.jpg');
        dirtTexture.wrapS = THREE.RepeatWrapping; dirtTexture.wrapT = THREE.RepeatWrapping;
        dirtTexture.repeat.set(12, 12);

        barkTexture = textureLoader.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/textures/brick_diffuse.jpg');
        leafTexture = textureLoader.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/textures/land_ocean_ice_cloud_2048.jpg');

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // 2. 地球（球体・素材テクスチャ）
        const planetGeo = new THREE.SphereGeometry(PLANET_RADIUS, 64, 64);
        const planetMat = new THREE.MeshStandardMaterial({ map: dirtTexture, roughness: 0.8 });
        const planetMesh = new THREE.Mesh(planetGeo, planetMat);
        scene.add(planetMesh);

        // 森と花の配置
        buildWorldForest();

        // 3. 主人公（黄色矢印頭）
        playerGroup = new THREE.Group();
        scene.add(playerGroup);
        buildYellowArrowPlayer(playerGroup);
        playerGroup.position.set(0, PLANET_RADIUS, 0);

        // 4. アンドロイド（追従）
        companionAndroidGroup = new THREE.Group();
        scene.add(companionAndroidGroup);
        buildCompanionAndroid(companionAndroidGroup);
        companionAndroidGroup.position.set(0, PLANET_RADIUS, -2);

        // 5. 町の人
        npcGroup = new THREE.Group();
        scene.add(npcGroup);
        buildSurrealNPC(npcGroup);
        npcGroup.position.set(-4, PLANET_RADIUS, -5);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    }

    function buildWorldForest() {
        for (let i = 0; i < 35; i++) {
            const tree = createTreeMesh();
            const phi = Math.random() * Math.PI * 0.45;
            const theta = Math.random() * Math.PI * 2;

            const x = PLANET_RADIUS * Math.sin(phi) * Math.cos(theta);
            const y = PLANET_RADIUS * Math.cos(phi);
            const z = PLANET_RADIUS * Math.sin(phi) * Math.sin(theta);

            tree.position.set(x, y, z);
            const up = new THREE.Vector3(x, y, z).normalize();
            tree.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), up);
            scene.add(tree);
        }
    }

    // インターネット素材を使った木
    function createTreeMesh() {
        const group = new THREE.Group();
        const trunkMat = new THREE.MeshStandardMaterial({ map: barkTexture, roughness: 0.9 });
        const leafMat = new THREE.MeshStandardMaterial({ color: 0x22aa22, roughness: 0.6 });

        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.45, 3, 10), trunkMat);
        trunk.position.y = 1.5;

        const leaf = new THREE.Mesh(new THREE.SphereGeometry(1.3, 16, 16), leafMat);
        leaf.position.y = 3.2;

        group.add(trunk, leaf);
        return group;
    }

    function buildYellowArrowPlayer(group) {
        clearGroup(group);
        const yellowMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, metalness: 0.3 });
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });

        const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.4), bodyMat);
        body.position.y = 0.8;
        
        const legL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.6, 0.2), bodyMat);
        legL.position.set(-0.2, 0.3, 0);
        const legR = legL.clone();
        legR.position.x = 0.2;

        const arrowHead = new THREE.Mesh(new THREE.ConeGeometry(0.65, 0.85, 4), yellowMat);
        arrowHead.position.y = 1.6;
        arrowHead.rotation.y = Math.PI / 4;

        group.add(body, legL, legR, arrowHead);
    }

    function buildCompanionAndroid(group) {
        clearGroup(group);
        const metalMat = new THREE.MeshStandardMaterial({ color: 0xbbbbbb, metalness: 0.8, roughness: 0.2 });
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff });

        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 0.8, 8), metalMat);
        body.position.y = 0.6;
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 0.4), metalMat);
        head.position.y = 1.2;
        const eye = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.1), eyeMat);
        eye.position.set(0, 1.25, 0.2);

        group.add(body, head, eye);
    }

    function buildSurrealNPC(group) {
        clearGroup(group);
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
        const hairMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const pantsMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c });

        const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.0), skinMat);
        head.position.y = 1.6;
        const hair = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.4, 1.05), hairMat);
        hair.position.y = 2.1;
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.3), pantsMat);
        body.position.y = 0.7;

        group.add(head, hair, body);
    }

    function buildPoopModel(group) {
        clearGroup(group);
        const goldMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, roughness: 0.1 });
        const t1 = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.4, 16, 32), goldMat);
        t1.rotation.x = Math.PI/2; t1.position.y = 0.4;
        const top = new THREE.Mesh(new THREE.ConeGeometry(0.5, 0.8, 16), goldMat);
        top.position.y = 1.2;
        group.add(t1, top);
    }

    function buildMoaiModel(group) {
        clearGroup(group);
        const stoneMat = new THREE.MeshStandardMaterial({ color: 0x778899, roughness: 0.9 });
        const face = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.2, 1.2), stoneMat);
        face.position.y = 1.1;
        const nose = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.8, 0.5), stoneMat);
        nose.position.set(0, 1.1, 0.7);
        group.add(face, nose);
    }

    function buildSegareModel(group) {
        clearGroup(group);
        const yellowMat = new THREE.MeshStandardMaterial({ color: 0xffcc00 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.6, 1.0), yellowMat);
        body.position.set(0, 0.6, 0);
        const neck = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.8, 0.3), yellowMat);
        neck.position.set(0, 1.5, 0.3);
        group.add(body, neck);
    }

    function clearGroup(group) {
        while(group.children.length > 0) group.remove(group.children[0]);
    }

    // --- 変珍（へんちん）処理（文章読み上げ付き） ---
    function triggerHenchin() {
        if (isAnimating) return;
        isAnimating = true;

        const w1Text = document.getElementById('w1').options[document.getElementById('w1').selectedIndex].text;
        const w2Text = document.getElementById('w2').options[document.getElementById('w2').selectedIndex].text;
        const w3Text = document.getElementById('w3').options[document.getElementById('w3').selectedIndex].text;
        const fullSentence = `${w1Text} ${w2Text} ${w3Text}！`;

        const w3Value = document.getElementById('w3').value;
        const overlay = document.getElementById('surreal-overlay');
        const uiLayer = document.getElementById('ui-layer');
        
        uiLayer.style.display = 'none';
        overlay.style.display = 'block';
        
        playCrazySound();
        speakSentence(fullSentence); // ★ 文章の音読音声

        const words = ["セケーン！", "マザー", "変・珍", "オトナ", "ヤバい", "バカ", "作文"];
        let interval = setInterval(() => {
            const div = document.createElement('div');
            div.className = 'surreal-text';
            div.innerText = words[Math.floor(Math.random() * words.length)];
            div.style.left = (Math.random() * 80) + 'vw';
            div.style.top = (Math.random() * 80) + 'vh';
            div.style.transform = `rotate(${Math.random() * 360}deg) scale(${Math.random() * 2 + 0.5})`;
            div.style.color = Math.random() > 0.5 ? '#ff00ff' : '#00ffff';
            overlay.appendChild(div);
            setTimeout(() => div.remove(), 300);
        }, 150);

        setTimeout(() => {
            clearInterval(interval);
            overlay.innerHTML = '';
            overlay.style.display = 'none';
            playPop();

            if (w3Value === 'unko') buildPoopModel(npcGroup);
            else if (w3Value === 'moai') buildMoaiModel(npcGroup);
            else if (w3Value === 'segare') buildSegareModel(npcGroup);
            
            isAnimating = false;
        }, 3200);
    }

    // メインアニメーションループ
    function animate() {
        requestAnimationFrame(animate);
        
        if (playerGroup && companionAndroidGroup && npcGroup) {
            if (!isAnimating) {
                const speed = 0.08;
                let dx = 0, dz = 0;

                if (keys.w || keys.W || keys.ArrowUp) dz -= speed;
                if (keys.s || keys.S || keys.ArrowDown) dz += speed;
                if (keys.a || keys.A || keys.ArrowLeft) dx -= speed;
                if (keys.d || keys.D || keys.ArrowRight) dx += speed;

                if (dx !== 0 || dz !== 0) {
                    playerGroup.position.x += dx;
                    playerGroup.position.z += dz;
                    playerHeading = Math.atan2(dx, dz);
                    playerGroup.rotation.y = playerHeading;
                }

                // 地球のカーブ補正
                const dist = Math.sqrt(playerGroup.position.x ** 2 + playerGroup.position.z ** 2);
                playerGroup.position.y = Math.sqrt(Math.max(1, PLANET_RADIUS ** 2 - dist ** 2));

                // アンドロイドの追従
                const followOffset = new THREE.Vector3(-Math.sin(playerHeading)*1.2, 0, -Math.cos(playerHeading)*1.2);
                const targetPos = playerGroup.position.clone().add(followOffset);
                companionAndroidGroup.position.lerp(targetPos, 0.1);
                companionAndroidGroup.rotation.y = playerHeading;

                // ★ カメラの自動回転・背後追従処理（地球の裏側でも画角が破綻しない）
                const camOffset = new THREE.Vector3(
                    Math.sin(playerHeading) * -6,
                    3.5,
                    Math.cos(playerHeading) * -6
                );
                const desiredCamPos = playerGroup.position.clone().add(camOffset);
                camera.position.lerp(desiredCamPos, 0.08);
                camera.lookAt(playerGroup.position.x, playerGroup.position.y + 0.8, playerGroup.position.z);

                // 町の人との距離判定
                const distanceToNPC = playerGroup.position.distanceTo(npcGroup.position);
                const uiLayer = document.getElementById('ui-layer');

                if (distanceToNPC < 3.8) {
                    uiLayer.style.display = 'flex';
                } else {
                    uiLayer.style.display = 'none';
                }
            }
        }

        renderer.render(scene, camera);
    }
</script>
</body>
</html>
