<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>続・せがれいじり風 変珍3Dシアター</title>
    <!-- Three.js 本体 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 外部3Dモデル読み込み用（GLTFLoader） -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <style>
        * { box-sizing: border-box; user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Meiryo', sans-serif; }

        /* オープニング動画画面 */
        #intro-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #111; z-index: 500;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .start-btn {
            margin-top: 20px; padding: 15px 40px; font-size: 24px; font-weight: bold;
            color: #fff; background: #ff007f; border: none; border-radius: 10px;
            cursor: pointer; box-shadow: 0 5px 0 #99004d; transition: transform 0.1s;
        }
        .start-btn:active { transform: translateY(5px); box-shadow: none; }

        /* 3Dキャンバス */
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* UIパネル (※最初は非表示、近づくと表示) */
        #ui-layer {
            display: none; position: absolute; bottom: 20px; width: 100%; z-index: 10;
            flex-direction: column; align-items: center; pointer-events: none;
        }
        .dialog {
            pointer-events: auto; background: rgba(255,255,255,0.9); border: 4px solid #ffcc00;
            border-radius: 15px; padding: 15px; margin-bottom: 15px; max-width: 600px;
            text-align: center; font-weight: bold; font-size: 18px; color: #333;
        }
        .sentence-panel {
            pointer-events: auto; background: rgba(0, 0, 0, 0.8); border: 4px solid #00e5ff;
            border-radius: 15px; padding: 20px; text-align: center;
        }
        select {
            font-size: 18px; font-weight: bold; padding: 10px; margin: 5px;
            border-radius: 8px; border: 3px solid #ffaa00; background-color: #fff; cursor: pointer;
        }
        .action-btn {
            font-size: 22px; font-weight: bold; padding: 12px 30px; margin-top: 10px;
            background: #00e5ff; color: #000; border: none; border-radius: 8px; cursor: pointer;
            box-shadow: 0 5px 0 #008b8b;
        }
        .action-btn:active { transform: translateY(5px); box-shadow: none; }

        /* 変珍（へんちん）シュールアニメーション用オーバーレイ */
        #surreal-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 200; background: repeating-radial-gradient(circle, #ff0055, #ffff00 10%, #0000ff 20%);
            animation: spinBg 3s linear infinite, flashBg 0.1s infinite alternate;
            overflow: hidden; pointer-events: none;
        }
        @keyframes spinBg { from { background-position: 0 0; } to { background-position: 100% 100%; } }
        @keyframes flashBg { 0% { filter: invert(0%) hue-rotate(0deg); } 100% { filter: invert(100%) hue-rotate(180deg); } }
        
        .surreal-text {
            position: absolute; font-size: 80px; font-weight: 900; color: #fff;
            text-shadow: 4px 4px 0 #000, -4px -4px 0 #000; white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- オープニング動画（YouTube埋め込み） -->
    <div id="intro-overlay">
        <h2 style="color:white; margin-bottom: 10px;">続・せがれいじり風 オープニング</h2>
        <iframe width="640" height="360" src="https://www.youtube.com/embed/hpQIPh4-kRE?rel=0" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        <button class="start-btn" onclick="startGame()">動画を見たら街へいく（ゲーム開始）</button>
    </div>

    <!-- シュールアニメーション演出（変珍時） -->
    <div id="surreal-overlay"></div>

    <!-- 3D表示領域 -->
    <div id="canvas-container"></div>

    <!-- UI (近づいた時だけ表示) -->
    <div id="ui-layer">
        <div class="dialog">
            👤 こまったちゃん（人間型アンドロイド）<br>
            「平凡な見た目に飽きたロボ…。作文の力でボクを変珍（へんちん）させてほしいロボ！」
        </div>
        <div class="sentence-panel">
            <select id="w1">
                <option value="せがれ">せがれが</option>
                <option value="マザー">マザーの愛で</option>
                <option value="セケーン">セケーンの風に吹かれ</option>
            </select>
            <select id="w2">
                <option value="dance">激しくブレイクダンスして</option>
                <option value="stretch">限界まで伸び切って</option>
                <option value="spin">高速回転しながら</option>
            </select>
            <select id="w3">
                <option value="unko">黄金のウンチになった</option>
                <option value="moai">モアイ像になった</option>
                <option value="segare">せがれ（本人）になった</option>
            </select>
            <br>
            <button class="action-btn" id="henchin-btn" onclick="triggerHenchin()">変珍（いじる）</button>
        </div>
    </div>

<script>
    // --- 音声・SE（Web Audio API） ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playCrazySound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(50, audioCtx.currentTime);
        for(let i=0; i<30; i++) {
            osc.frequency.setValueAtTime(Math.random() * 2000 + 100, audioCtx.currentTime + (i * 0.1));
        }
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 3.0);
        osc.start(); osc.stop(audioCtx.currentTime + 3.0);
    }

    function playPop() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }

    // --- ゲーム開始処理 ---
    function startGame() {
        document.getElementById('intro-overlay').style.display = 'none';
        if (audioCtx.state === 'suspended') audioCtx.resume();
        init3D();
        alert("【操作方法】\nキーボードの「WASD」または「矢印キー」で主人公を操作して、奥にいるこまったちゃんに近づいてね！");
    }

    // --- Three.js 3Dグラフィック処理 ---
    let scene, camera, renderer, androidGroup, playerGroup;
    let skyTexture, stoneTexture, grassTexture;
    let leftLeg, rightLeg, leftArm, rightArm; // 歩行アニメーション用パーツ
    let isAnimating = false;
    let walkTime = 0;

    // キーボード入力の状態管理
    const keys = { w: false, a: false, s: false, d: false, W: false, A: false, S: false, D: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
    window.addEventListener('keydown', (e) => { if (e.key in keys) keys[e.key] = true; });
    window.addEventListener('keyup', (e) => { if (e.key in keys) keys[e.key] = false; });

    function init3D() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();

        // 1. インターネット上の空テクスチャを背景に設定
        const textureLoader = new THREE.TextureLoader();
        skyTexture = textureLoader.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/textures/2294472375_24a3b8ef46_o.jpg', () => {
            skyTexture.mapping = THREE.EquirectangularReflectionMapping;
            scene.background = skyTexture;
        });

        // 2. 地面（芝生テクスチャ）
        grassTexture = textureLoader.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/textures/terrain/grasslight-big.jpg');
        grassTexture.wrapS = THREE.RepeatWrapping;
        grassTexture.wrapT = THREE.RepeatWrapping;
        grassTexture.repeat.set(10, 10);
        
        const floorMat = new THREE.MeshStandardMaterial({ map: grassTexture, roughness: 0.8 });
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // 石テクスチャ（モアイ用）
        stoneTexture = textureLoader.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/textures/brick_diffuse.jpg');

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        container.appendChild(renderer.domElement);

        // 照明
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(10, 20, 15);
        scene.add(dirLight);

        // オブジェクトグループ構築
        androidGroup = new THREE.Group();
        androidGroup.position.set(0, 0, -6);
        scene.add(androidGroup);

        playerGroup = new THREE.Group();
        playerGroup.position.set(0, 0, 0);
        scene.add(playerGroup);

        // 主人公（矢印頭のせがれ）モデル生成
        buildArrowPlayerModel(playerGroup);
        
        // こまったちゃん（人間型アンドロイド）初期モデル
        loadInternetModel('https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/models/gltf/Xbot.glb', androidGroup);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    }

    // ★ 主人公モデル（頭：赤矢印, 体：人間風）
    function buildArrowPlayerModel(group) {
        clearGroup(group);
        
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.5 });
        const shirtMat = new THREE.MeshStandardMaterial({ color: 0x0088ff, roughness: 0.4 });
        const pantsMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.6 });
        const arrowMat = new THREE.MeshStandardMaterial({ color: 0xff0044, metalness: 0.5, roughness: 0.2 });

        // 胴体
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.5), shirtMat);
        torso.position.y = 1.6;
        group.add(torso);

        // 脚（歩行アニメ用に保持）
        leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.0, 0.3), pantsMat);
        leftLeg.position.set(-0.25, 0.5, 0);
        rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.0, 0.3), pantsMat);
        rightLeg.position.set(0.25, 0.5, 0);
        group.add(leftLeg, rightLeg);

        // 腕
        leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.25, 1.0, 0.25), skinMat);
        leftArm.position.set(-0.55, 1.5, 0);
        rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.25, 1.0, 0.25), skinMat);
        rightArm.position.set(0.55, 1.5, 0);
        group.add(leftArm, rightArm);

        // 矢印の頭
        const arrowHeadGroup = new THREE.Group();
        arrowHeadGroup.position.y = 2.6;

        const cone = new THREE.Mesh(new THREE.ConeGeometry(0.65, 0.9, 4), arrowMat);
        cone.position.y = 0.4;
        cone.rotation.y = Math.PI / 4;

        const stem = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.4, 0.3), arrowMat);
        stem.position.y = -0.1;

        arrowHeadGroup.add(cone, stem);
        group.add(arrowHeadGroup);
    }

    // 外部GLTFモデル読み込み
    function loadInternetModel(url, targetGroup) {
        const loader = new THREE.GLTFLoader();
        loader.load(url, function(gltf) {
            clearGroup(targetGroup);
            const model = gltf.scene;
            model.scale.set(1.5, 1.5, 1.5);
            targetGroup.add(model);
        }, undefined, function(error) {
            console.error('モデルロード失敗', error);
            buildDefaultAndroid(targetGroup);
        });
    }

    function buildDefaultAndroid(group) {
        clearGroup(group);
        const mat = new THREE.MeshStandardMaterial({ color: 0x999999, metalness: 0.8 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.5, 1), mat);
        body.position.y = 1.5;
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), mat);
        head.position.y = 2.8;
        group.add(body, head);
    }

    // ★ 1. リアルな「黄金のウンチ」モデル（背景空の反射・滑らかなスプライン曲線）
    function buildRealPoopModel(group) {
        clearGroup(group);
        const points = [];
        for (let i = 0; i < 30; i++) {
            const t = i / 30;
            const radius = (1 - t) * Math.sin(t * Math.PI) * 1.2 + 0.1;
            const y = t * 2.5;
            points.push(new THREE.Vector2(radius, y));
        }
        const geo = new THREE.LatheGeometry(points, 32);
        const goldMat = new THREE.MeshStandardMaterial({
            color: 0xffd700,
            metalness: 0.95,
            roughness: 0.1,
            envMap: skyTexture,
            envMapIntensity: 2.0
        });
        const poop = new THREE.Mesh(geo, goldMat);
        poop.position.y = 0.2;
        group.add(poop);
    }

    // ★ 2. リアルな「モアイ像」モデル（石材テクスチャ仕上げ）
    function buildRealMoaiModel(group) {
        clearGroup(group);
        const stoneMat = new THREE.MeshStandardMaterial({
            map: stoneTexture,
            roughness: 0.9,
            metalness: 0.1
        });
        
        // 頭部立体
        const head = new THREE.Mesh(new THREE.BoxGeometry(1.6, 3.2, 1.6, 4, 4, 4), stoneMat);
        head.position.y = 1.8;
        
        // 鼻
        const nose = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.2, 0.7), stoneMat);
        nose.position.set(0, 1.8, 0.9);
        
        // 額・眉の出っ張り
        const brow = new THREE.Mesh(new THREE.BoxGeometry(1.65, 0.4, 0.8), stoneMat);
        brow.position.set(0, 2.7, 0.7);

        // 唇
        const lips = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.3, 0.6), stoneMat);
        lips.position.set(0, 0.9, 0.8);

        group.add(head, nose, brow, lips);
    }

    // ★ 3. リアルな「せがれ（キリン首）」モデル
    function buildRealSegareModel(group) {
        clearGroup(group);
        const yellowMat = new THREE.MeshStandardMaterial({
            color: 0xf2b705,
            roughness: 0.4,
            metalness: 0.1
        });
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });

        // 胴体
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.8, 1.6, 16), yellowMat);
        body.position.set(0, 0.8, 0);

        // 首（滑らかなテーパー）
        const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 3.0, 16), yellowMat);
        neck.position.set(0, 2.5, 0.3);
        neck.rotation.x = -0.1;

        // 頭部
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 1.2), yellowMat);
        head.position.set(0, 4.0, 0.7);

        // つぶらな瞳
        const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), eyeMat);
        eyeL.position.set(-0.36, 4.1, 1.0);
        const eyeR = eyeL.clone();
        eyeR.position.x = 0.36;

        group.add(body, neck, head, eyeL, eyeR);
    }

    function clearGroup(group) {
        while(group.children.length > 0) group.remove(group.children[0]);
    }

    // --- 変珍（へんちん）アニメーション演出 ---
    function triggerHenchin() {
        if (isAnimating) return;
        isAnimating = true;

        const w3 = document.getElementById('w3').value;
        const overlay = document.getElementById('surreal-overlay');
        const uiLayer = document.getElementById('ui-layer');
        
        uiLayer.style.display = 'none';
        overlay.style.display = 'block';
        playCrazySound();

        const words = ["セケーン！", "マザー", "変・珍", "オトナ", "ヤバい", "バカ", "作文"];
        let interval = setInterval(() => {
            const div = document.createElement('div');
            div.className = 'surreal-text';
            div.innerText = words[Math.floor(Math.random() * words.length)];
            div.style.left = (Math.random() * 80) + 'vw';
            div.style.top = (Math.random() * 80) + 'vh';
            div.style.transform = `rotate(${Math.random() * 360}deg) scale(${Math.random() * 2 + 0.5})`;
            div.style.color = Math.random() > 0.5 ? '#ff00ff' : '#00ffff';
            overlay.appendChild(div);
            setTimeout(() => div.remove(), 300);
        }, 150);

        setTimeout(() => {
            clearInterval(interval);
            overlay.innerHTML = '';
            overlay.style.display = 'none';
            playPop();

            // 選択に応じてリアルに変珍！
            if (w3 === 'unko') buildRealPoopModel(androidGroup);
            else if (w3 === 'moai') buildRealMoaiModel(androidGroup);
            else if (w3 === 'segare') buildRealSegareModel(androidGroup);
            
            isAnimating = false;
        }, 3000);
    }

    // メインアニメーションループ
    function animate() {
        requestAnimationFrame(animate);
        
        if (playerGroup && androidGroup) {
            if (!isAnimating) {
                // 移動処理
                const speed = 0.12;
                let moveX = 0, moveZ = 0;

                if (keys.w || keys.W || keys.ArrowUp) moveZ -= speed;
                if (keys.s || keys.S || keys.ArrowDown) moveZ += speed;
                if (keys.a || keys.A || keys.ArrowLeft) moveX -= speed;
                if (keys.d || keys.D || keys.ArrowRight) moveX += speed;

                if (moveX !== 0 || moveZ !== 0) {
                    playerGroup.position.x += moveX;
                    playerGroup.position.z += moveZ;

                    // 進行方向を向く
                    playerGroup.rotation.y = Math.atan2(moveX, moveZ);

                    // 歩行アニメーション（手足を振る）
                    walkTime += 0.2;
                    if (leftLeg && rightLeg) {
                        leftLeg.rotation.x = Math.sin(walkTime) * 0.6;
                        rightLeg.rotation.x = -Math.sin(walkTime) * 0.6;
                        leftArm.rotation.x = -Math.sin(walkTime) * 0.6;
                        rightArm.rotation.x = Math.sin(walkTime) * 0.6;
                    }
                } else {
                    // 停止時は姿勢リセット
                    if (leftLeg && rightLeg) {
                        leftLeg.rotation.x = 0; rightLeg.rotation.x = 0;
                        leftArm.rotation.x = 0; rightArm.rotation.x = 0;
                    }
                }

                // カメラ追従
                camera.position.x = playerGroup.position.x;
                camera.position.z = playerGroup.position.z + 8;
                camera.position.y = playerGroup.position.y + 4;
                camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.5, playerGroup.position.z);

                // こまったちゃんとの接近判定
                const distance = playerGroup.position.distanceTo(androidGroup.position);
                const uiLayer = document.getElementById('ui-layer');

                if (distance < 4.0) {
                    uiLayer.style.display = 'flex';
                } else {
                    uiLayer.style.display = 'none';
                }
            }
        }

        renderer.render(scene, camera);
    }
</script>
</body>
</html>
