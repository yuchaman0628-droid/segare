<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>続・せがれいじり風 変珍3Dシアター</title>
    <!-- Three.js 本体 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 外部3Dモデル読み込み用（GLTFLoader） -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <style>
        * { box-sizing: border-box; user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Meiryo', sans-serif; }

        /* オープニング動画画面 */
        #intro-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #111; z-index: 500;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .start-btn {
            margin-top: 20px; padding: 15px 40px; font-size: 24px; font-weight: bold;
            color: #fff; background: #ff007f; border: none; border-radius: 10px;
            cursor: pointer; box-shadow: 0 5px 0 #99004d; transition: transform 0.1s;
        }
        .start-btn:active { transform: translateY(5px); box-shadow: none; }

        /* 3Dキャンバス */
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* UIパネル (※最初は非表示、近づくと表示) */
        #ui-layer {
            display: none; position: absolute; bottom: 20px; width: 100%; z-index: 10;
            flex-direction: column; align-items: center; pointer-events: none;
        }
        .dialog {
            pointer-events: auto; background: rgba(255,255,255,0.9); border: 4px solid #ffcc00;
            border-radius: 15px; padding: 15px; margin-bottom: 15px; max-width: 600px;
            text-align: center; font-weight: bold; font-size: 18px; color: #333;
        }
        .sentence-panel {
            pointer-events: auto; background: rgba(0, 0, 0, 0.8); border: 4px solid #00e5ff;
            border-radius: 15px; padding: 20px; text-align: center;
        }
        select {
            font-size: 18px; font-weight: bold; padding: 10px; margin: 5px;
            border-radius: 8px; border: 3px solid #ffaa00; background-color: #fff; cursor: pointer;
        }
        .action-btn {
            font-size: 22px; font-weight: bold; padding: 12px 30px; margin-top: 10px;
            background: #00e5ff; color: #000; border: none; border-radius: 8px; cursor: pointer;
            box-shadow: 0 5px 0 #008b8b;
        }
        .action-btn:active { transform: translateY(5px); box-shadow: none; }

        /* 変珍（へんちん）シュールアニメーション用オーバーレイ */
        #surreal-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 200; background: repeating-radial-gradient(circle, #ff0055, #ffff00 10%, #0000ff 20%);
            animation: spinBg 3s linear infinite, flashBg 0.1s infinite alternate;
            overflow: hidden; pointer-events: none;
        }
        @keyframes spinBg { from { background-position: 0 0; } to { background-position: 100% 100%; } }
        @keyframes flashBg { 0% { filter: invert(0%) hue-rotate(0deg); } 100% { filter: invert(100%) hue-rotate(180deg); } }
        
        .surreal-text {
            position: absolute; font-size: 80px; font-weight: 900; color: #fff;
            text-shadow: 4px 4px 0 #000, -4px -4px 0 #000; white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- オープニング動画（YouTube埋め込み） -->
    <div id="intro-overlay">
        <h2 style="color:white; margin-bottom: 10px;">続・せがれいじり風 オープニング</h2>
        <iframe width="640" height="360" src="https://www.youtube.com/embed/hpQIPh4-kRE?rel=0" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        <button class="start-btn" onclick="startGame()">動画を見たら街へいく（ゲーム開始）</button>
    </div>

    <!-- シュールアニメーション演出（変珍時） -->
    <div id="surreal-overlay"></div>

    <!-- 3D表示領域 -->
    <div id="canvas-container"></div>

    <!-- UI (近づいた時だけ表示) -->
    <div id="ui-layer">
        <div class="dialog">
            👤 こまったちゃん（人間型アンドロイド）<br>
            「平凡な見た目に飽きたロボ…。作文の力でボクを変珍（へんちん）させてほしいロボ！」
        </div>
        <div class="sentence-panel">
            <select id="w1">
                <option value="せがれ">せがれが</option>
                <option value="マザー">マザーの愛で</option>
                <option value="セケーン">セケーンの風に吹かれ</option>
            </select>
            <select id="w2">
                <option value="dance">激しくブレイクダンスして</option>
                <option value="stretch">限界まで伸び切って</option>
                <option value="spin">高速回転しながら</option>
            </select>
            <select id="w3">
                <option value="unko">黄金のウンチになった</option>
                <option value="moai">モアイ像になった</option>
                <option value="segare">せがれ（本人）になった</option>
            </select>
            <br>
            <button class="action-btn" onclick="triggerHenchin()">変珍（いじる）</button>
        </div>
    </div>

<script>
    // --- 音声・SE（Web Audio API） ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playCrazySound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(50, audioCtx.currentTime);
        for(let i=0; i<30; i++) {
            osc.frequency.setValueAtTime(Math.random() * 2000 + 100, audioCtx.currentTime + (i * 0.1));
        }
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 3.0);
        osc.start(); osc.stop(audioCtx.currentTime + 3.0);
    }

    function playPop() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }

    // --- ゲーム開始処理 ---
    function startGame() {
        document.getElementById('intro-overlay').style.display = 'none';
        if (audioCtx.state === 'suspended') audioCtx.resume();
        init3D();
        // プレイヤーに操作方法を1回だけ通知
        alert("【操作方法】\nキーボードの「WASD」または「矢印キー」で主人公（手前のキャラクター）を動かして、奥にいるこまったちゃんに近づいてお願いを聞いてね！");
    }

    // --- Three.js 3Dグラフィック処理 ---
    let scene, camera, renderer, androidGroup, playerGroup;
    let isAnimating = false;
    let isNearNPC = false; // NPC接近フラグ

    // キーボード入力の状態管理
    const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
    window.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
    window.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });

    function init3D() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), new THREE.MeshStandardMaterial({ color: 0x55aa55 }));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // 1. こまったちゃん（人間型アンドロイド・NPC）のグループ
        androidGroup = new THREE.Group();
        androidGroup.position.set(0, 0, -6); // 最初は奥に配置
        scene.add(androidGroup);

        // 2. 主人公（プレイヤー）のグループ
        playerGroup = new THREE.Group();
        playerGroup.position.set(0, 0, 0); // 最初は手前
        scene.add(playerGroup);

        // モデルの構築
        buildSegareModel(playerGroup); // 主人公（せがれ）を作る
        
        // ★ インターネット上の無料人間型3Dモデル（Xbot）を読み込む
        loadInternetModel('https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/models/gltf/Xbot.glb', androidGroup);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    }

    // 外部の人間型3Dモデルを読み込む関数
    function loadInternetModel(url, targetGroup) {
        const loader = new THREE.GLTFLoader();
        loader.load(url, function(gltf) {
            clearGroup(targetGroup);
            const model = gltf.scene;
            model.scale.set(1.5, 1.5, 1.5);
            targetGroup.add(model);
        }, undefined, function(error) {
            console.error('モデルの読み込みに失敗しました', error);
            buildDefaultAndroid(targetGroup); // 失敗時の保険
        });
    }

    // 各種モデル構築用関数（対象グループを指定できるように改修）
    function buildDefaultAndroid(group) {
        clearGroup(group);
        const mat = new THREE.MeshStandardMaterial({ color: 0x999999, metalness: 0.8 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.5, 1), mat);
        body.position.y = 1.5;
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), mat);
        head.position.y = 2.8;
        group.add(body, head);
    }

    function buildSegareModel(group) {
        clearGroup(group);
        const yellowMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, metalness: 0.3, roughness: 0.4 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(1, 0.8, 1.5), yellowMat);
        body.position.set(0, 0.8, 0);
        const neck = new THREE.Mesh(new THREE.BoxGeometry(0.4, 2.5, 0.4), yellowMat);
        neck.position.set(0, 2.0, 0.4);
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.8), yellowMat);
        head.position.set(0, 3.4, 0.6);
        group.add(body, neck, head);
    }

    function buildPoopModel(group) {
        clearGroup(group);
        const goldMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 1.0, roughness: 0.1 });
        const t1 = new THREE.Mesh(new THREE.TorusGeometry(1, 0.5, 16, 32), goldMat);
        t1.rotation.x = Math.PI/2; t1.position.y = 0.5;
        const t2 = new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.4, 16, 32), goldMat);
        t2.rotation.x = Math.PI/2; t2.position.y = 1.2;
        const top = new THREE.Mesh(new THREE.ConeGeometry(0.4, 1, 16), goldMat);
        top.position.y = 2.0;
        group.add(t1, t2, top);
    }

    function buildMoaiModel(group) {
        clearGroup(group);
        const stoneMat = new THREE.MeshStandardMaterial({ color: 0x778899, roughness: 1.0 });
        const face = new THREE.Mesh(new THREE.BoxGeometry(1.5, 3, 1.5), stoneMat);
        face.position.y = 1.5;
        const nose = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1, 0.6), stoneMat);
        nose.position.set(0, 1.5, 1.0);
        group.add(face, nose);
    }

    function clearGroup(group) {
        while(group.children.length > 0) group.remove(group.children[0]);
    }

    // --- 変珍（へんちん）アニメーション演出 ---
    function triggerHenchin() {
        if (isAnimating) return;
        isAnimating = true;

        const w3 = document.getElementById('w3').value;
        const overlay = document.getElementById('surreal-overlay');
        const uiLayer = document.getElementById('ui-layer');
        
        uiLayer.style.display = 'none'; // 演出中はUIを隠す
        overlay.style.display = 'block';
        playCrazySound();

        const words = ["セケーン！", "マザー", "変・珍", "オトナ", "ヤバい", "バカ", "作文"];
        let interval = setInterval(() => {
            const div = document.createElement('div');
            div.className = 'surreal-text';
            div.innerText = words[Math.floor(Math.random() * words.length)];
            div.style.left = (Math.random() * 80) + 'vw';
            div.style.top = (Math.random() * 80) + 'vh';
            div.style.transform = `rotate(${Math.random() * 360}deg) scale(${Math.random() * 2 + 0.5})`;
            div.style.color = Math.random() > 0.5 ? '#ff00ff' : '#00ffff';
            overlay.appendChild(div);
            setTimeout(() => div.remove(), 300);
        }, 150);

        setTimeout(() => {
            clearInterval(interval);
            overlay.innerHTML = '';
            overlay.style.display = 'none';
            playPop();

            // NPC（こまったちゃん）の姿が変化！
            if (w3 === 'unko') buildPoopModel(androidGroup);
            else if (w3 === 'moai') buildMoaiModel(androidGroup);
            else if (w3 === 'segare') buildSegareModel(androidGroup);
            
            uiLayer.style.display = 'flex'; // UI戻す
            isAnimating = false;
        }, 3000);
    }

    // メインアニメーションループ
    function animate() {
        requestAnimationFrame(animate);
        
        if (!isAnimating && playerGroup && androidGroup) {
            // --- プレイヤーの移動処理 ---
            const speed = 0.15;
            if (keys.w || keys.ArrowUp) playerGroup.position.z -= speed;
            if (keys.s || keys.ArrowDown) playerGroup.position.z += speed;
            if (keys.a || keys.ArrowLeft) playerGroup.position.x -= speed;
            if (keys.d || keys.ArrowRight) playerGroup.position.x += speed;

            // カメラを主人公（プレイヤー）の後ろに追従させる
            camera.position.x = playerGroup.position.x;
            camera.position.z = playerGroup.position.z + 8;
            camera.lookAt(playerGroup.position);

            // --- 接近判定（こまったちゃんのお願いを聞く） ---
            const distance = playerGroup.position.distanceTo(androidGroup.position);
            const uiLayer = document.getElementById('ui-layer');

            if (distance < 3.5) {
                // 近づいたらUIを表示
                if (!isNearNPC) {
                    uiLayer.style.display = 'flex';
                    isNearNPC = true;
                }
            } else {
                // 離れたらUIを隠す
                if (isNearNPC) {
                    uiLayer.style.display = 'none';
                    isNearNPC = false;
                }
            }
        }

        renderer.render(scene, camera);
    }
</script>
</body>
</html>
